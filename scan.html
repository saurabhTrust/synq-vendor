<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Opening Synq...</title>
  <style>
    body { margin: 0; display: flex; align-items: center; justify-content: center;
           height: 100vh; font-family: sans-serif; background: #0a0a0a; color: #fff; }
    .spinner { width: 32px; height: 32px; border: 3px solid #333;
               border-top-color: #7c5cfc; border-radius: 50%; animation: spin 0.8s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <div style="text-align:center">
    <div class="spinner"></div>
    <p style="margin-top:16px;font-size:14px;color:#666">Opening Synq...</p>
  </div>
  <script>
    // Capture browser fingerprint, then redirect server-side
    const tz = Intl.DateTimeFormat().resolvedOptions().timeZone || '';
    const sc = `${screen.width}x${screen.height}`;
    const vendorId = location.pathname.split('/').pop();
    // Redirect to server route with fingerprint params
    location.replace(`/go/${vendorId}?tz=${encodeURIComponent(tz)}&sc=${encodeURIComponent(sc)}`);
  </script>
</body>
</html>
